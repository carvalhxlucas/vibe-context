<div class="modal-backdrop" data-modal>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Anexar da biblioteca">
    <div class="modal-head">
      <div class="row-between">
        <span class="modal-title">Anexar da biblioteca <span class="dim">→</span> <span class="mono accent">{{ target_name }}</span></span>
        <button class="icon-btn boxed" data-close-modal aria-label="Fechar">×</button>
      </div>
      <input id="picker-q" class="input" type="search" name="q" placeholder="Buscar…" autocomplete="off" autofocus
             hx-get="/ui/picker?target={{ target }}&rows_only=true" hx-target="#picker-rows" hx-swap="outerHTML"
             hx-trigger="input changed delay:200ms">
    </div>
    {% include "partials/picker_rows.html" %}
  </div>
</div>
