[project]
name = "vibecontext"
version = "0.2.1"
description = "Local RAG backend for the VibeContext Claude Code plugin."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "pydantic-settings>=2.15",
    "mcp>=2.2",
    "python-multipart>=0.0.32",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "tree-sitter-language-pack>=1.20.0",
    "tiktoken>=0.14.0",
    "qdrant-client>=1.19.1",
    "fastembed>=0.8.1",
    "sentence-transformers>=6.1.0",
    "openai>=3.19.2",
    "cohere>=7.1.1",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibecontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests use the in-memory Qdrant, which ignores payload indexes and says so.
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]
