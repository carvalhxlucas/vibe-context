<div class="modal-backdrop" data-modal>
  <div class="modal wide" role="dialog" aria-modal="true" aria-label="Chunks de {{ document.filename }}">
    <div class="modal-head">
      <div class="row-between">
        <span class="modal-title">{{ document.filename }} <span class="dim mono small">{{ chunks|length }} chunks · o que o search_context devolve ao Claude</span></span>
        <button class="icon-btn boxed" data-close-modal aria-label="Fechar">×</button>
      </div>
    </div>
    <div class="modal-body">
      {% for c in chunks %}
        <article class="chunk">
          <header class="mono">#{{ c.ordinal }} · {{ c.token_count }} tokens{% if c.meta | location %} · {{ c.meta | location }}{% endif %}</header>
          <pre>{{ c.text }}</pre>
        </article>
      {% endfor %}
    </div>
  </div>
</div>
